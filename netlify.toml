# Netlify configuration for the IA Para Todos website.
# App source lives in website/; Netlify builds and publishes from there.
# The Angular build prerenders every public route to static HTML, so no
# SPA fallback is used: unknown paths serve 404.html with a real 404.

[build]
  base = "website"
  command = "npm run build"
  publish = "dist/website/browser"

[build.environment]
  NODE_VERSION = "24.16.0"
  NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"

# The admin theme is a stable-name side-built asset: always revalidate.
[[headers]]
  for = "/admin-theme.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Admin gating (role rules run before the catch-all): the overview,
# inbox, workshops, impact, supporters, and plans pages serve their
# prerendered shells only to Identity users whose JWT carries the admin role;
# everyone else falls through to the 404 rule. /admin/sign-in stays
# public so the owner can sign in.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200
  force = true
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin/index.html"
  to = "/admin/index.html"
  status = 200
  force = true
