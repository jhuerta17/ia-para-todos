# Custom 404: Netlify serves existing prerendered files first (no force),
# so this only catches unknown paths. 404.html is the client shell, which
# boots the branded Angular recovery page for visitors with JavaScript.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
