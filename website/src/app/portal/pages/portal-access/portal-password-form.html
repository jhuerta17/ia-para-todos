<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="field" role="group" [attr.aria-invalid]="invalid('password') ? 'true' : null">
    <label for="portal-new-password">{{ c().password }}</label>
    <input
      id="portal-new-password"
      formControlName="password"
      type="password"
      [placeholder]="c().passwordPlaceholder"
      autocomplete="new-password"
      [attr.aria-invalid]="invalid('password') ? 'true' : null"
    />
    @if (invalid('password')) {
      <p class="error" role="alert">{{ passwordError() }}</p>
    }
  </div>
  <div class="field" role="group" [attr.aria-invalid]="invalid('confirm') ? 'true' : null">
    <label for="portal-new-password-confirm">{{ c().confirm }}</label>
    <input
      id="portal-new-password-confirm"
      formControlName="confirm"
      type="password"
      [placeholder]="c().confirmPlaceholder"
      autocomplete="new-password"
      [attr.aria-invalid]="invalid('confirm') ? 'true' : null"
    />
    @if (invalid('confirm')) {
      <p class="error" role="alert">{{ confirmError() }}</p>
    }
  </div>
  @if (failed(); as message) {
    <div role="alert" class="failed">{{ message }}</div>
  }
  <div class="submit-row">
    <button appActionButton type="submit" [disabled]="submitting()">
      {{ submitting() ? c().saving : (submitLabel() ?? c().save) }}
    </button>
  </div>
</form>
