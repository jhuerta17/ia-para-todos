@if (demo.enabled()) {
  <div role="status" class="flex items-center justify-between gap-4 border-b border-amber-300 bg-amber-50 px-4 py-2.5 text-sm text-amber-900 md:px-6 dark:border-amber-400/30 dark:bg-amber-400/10 dark:text-amber-200">
    <p>
      <strong class="font-semibold">Demo data.</strong>
      These figures are simulated for demonstration, not real operations.
    </p>
    <button
      type="button"
      (click)="demo.disable()"
      class="inline-flex h-8 shrink-0 items-center rounded-lg border border-amber-400/60 bg-transparent px-3 text-sm font-medium transition-colors hover:bg-amber-100 dark:hover:bg-amber-400/20"
    >
      Exit demo
    </button>
  </div>
}
