<div class="admin-access-root auth-page">
  <main class="auth-main" tabindex="-1">
    <div class="auth-top"><a routerLink="/"><app-icon name="arrow-left" /> Back to site</a></div>
    <div class="auth-form">
      <a class="auth-mobile-brand" routerLink="/" [attr.aria-label]="brand"><app-brand-mark style="--logo-size:2.25rem" /><span>{{ brand }}</span></a>
      <ng-content />
    </div>
  </main>
  <aside class="auth-brand">
    <a class="auth-brand-link" routerLink="/" [attr.aria-label]="brand"><app-brand-mark style="--logo-size:3rem" /><span>{{ brand }}</span></a>
    <p class="auth-brand-description">Your space to manage, support, and keep things moving forward.</p>
  </aside>
</div>
