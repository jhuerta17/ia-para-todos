<header class="sticky top-0 z-50 flex w-full shrink-0 border-gray-200 bg-white xl:border-b dark:border-gray-800 dark:bg-gray-900">
  <div class="flex grow flex-col items-center justify-between xl:flex-row xl:px-6">
    <div class="flex w-full items-center justify-between gap-2 border-b border-gray-200 px-3 py-3 sm:gap-4 xl:justify-normal xl:border-b-0 xl:px-0 xl:py-4 dark:border-gray-800">
      <button
        type="button"
        (click)="handleToggle()"
        aria-label="Show or hide the menu"
        class="inline-flex size-10 items-center justify-center rounded-[10px] border border-gray-300 bg-transparent text-gray-500 shadow-theme-xs transition-all hover:bg-gray-50 hover:text-gray-800 lg:size-11 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700/50 dark:hover:text-white"
        [ngClass]="{ 'bg-gray-100 dark:bg-white/3': isMobileOpen$ | async }"
      >
        @if (isMobileOpen$ | async) {
          <app-icon name="x" />
        } @else {
          <app-icon name="menu-2" />
        }
      </button>

      <a routerLink="/admin" aria-label="Admin dashboard" class="flex items-center gap-2 xl:hidden">
        <app-brand-mark style="--logo-size: 1.75rem" />
        <span class="font-display text-base font-bold text-gray-900 dark:text-white">{{ brand }}</span>
      </a>

      <button
        type="button"
        (click)="toggleApplicationMenu()"
        aria-label="Show or hide the account menu"
        class="inline-flex size-10 items-center justify-center rounded-lg text-gray-700 hover:bg-gray-100 xl:hidden dark:text-gray-400 dark:hover:bg-gray-800"
      >
        <app-icon name="users" />
      </button>
    </div>

    <div
      class="w-full items-center justify-between gap-4 px-5 py-4 shadow-theme-md xl:flex xl:justify-end xl:px-0 xl:shadow-none"
      [ngClass]="isApplicationMenuOpen ? 'flex' : 'hidden'"
    >
      <app-admin-user-dropdown />
    </div>
  </div>
</header>
