<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div
    role="group" class="field"
    [attr.data-invalid]="isInvalid('email') ? 'true' : null"
  >
    <label for="admin-email">
      Email <span aria-hidden="true">*</span>
    </label>
    <input
      id="admin-email"
      formControlName="email"
      type="email"
      placeholder="name@example.com"
      autocomplete="email"
      [attr.aria-invalid]="isInvalid('email') ? 'true' : null"
    />
    @if (isInvalid('email')) {
      <div role="alert" class="error">{{ errorFor('email') }}</div>
    }
  </div>

  <div
    role="group" class="field"
    [attr.data-invalid]="isInvalid('password') ? 'true' : null"
  >
    <label for="admin-password">
      Password <span aria-hidden="true">*</span>
    </label>
    <div class="password-control">
      <input
        id="admin-password"
        formControlName="password"
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Enter your password"
        autocomplete="current-password"
        [attr.aria-invalid]="isInvalid('password') ? 'true' : null"
      />
      <div>
        <button
          class="password-toggle" type="button"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          {{ showPassword ? 'Hide' : 'Show' }}
        </button>
      </div>
    </div>
    @if (isInvalid('password')) {
      <div role="alert" class="error">{{ errorFor('password') }}</div>
    }
  </div>

  @if (failed(); as message) {
    <div role="alert" class="failed">
      {{ message }}
    </div>
  }

  <div class="submit-row">
    <button appActionButton
      type="submit"
      [disabled]="submitting()"
    >
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </div>
</form>
