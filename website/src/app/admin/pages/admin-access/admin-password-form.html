<form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div role="group" class="field">
    <label for="admin-new-password">
      Password <span aria-hidden="true">*</span>
    </label>
    <input
      id="admin-new-password"
      formControlName="password"
      type="password"
      placeholder="At least 8 characters"
      autocomplete="new-password"
      [attr.aria-invalid]="invalid('password') ? 'true' : null"
    />
    @if (passwordError(); as message) {
      <div role="alert" class="error">{{ message }}</div>
    }
  </div>

  <div role="group" class="field">
    <label for="admin-new-password-confirm">
      Confirm password <span aria-hidden="true">*</span>
    </label>
    <input
      id="admin-new-password-confirm"
      formControlName="confirm"
      type="password"
      placeholder="Repeat your password"
      autocomplete="new-password"
      [attr.aria-invalid]="invalid('confirm') ? 'true' : null"
    />
    @if (confirmError(); as message) {
      <div role="alert" class="error">{{ message }}</div>
    }
  </div>

  @if (failed(); as message) {
    <div role="alert" class="failed">
      {{ message }}
    </div>
  }

  <div class="submit-row">
    <button appActionButton
      type="submit"
      [disabled]="submitting()"
    >
      {{ submitting() ? 'Saving…' : submitLabel }}
    </button>
  </div>
</form>
