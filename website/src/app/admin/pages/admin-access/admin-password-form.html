<form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5" novalidate>
  <div role="group" class="group/field flex w-full flex-col gap-2 *:w-full">
    <label class="mb-1.5 block flex w-fit gap-2 text-sm leading-snug font-medium text-gray-700 select-none dark:text-gray-400" for="admin-new-password">
      Contraseña <span class="text-red-500" aria-hidden="true">*</span>
    </label>
    <input
      id="admin-new-password"
      formControlName="password"
      type="password"
      placeholder="Al menos 8 caracteres"
      autocomplete="new-password"
      class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-white px-4 py-2.5 text-sm font-normal text-gray-800 shadow-theme-xs transition-colors outline-hidden placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-gray-500 dark:focus:border-brand-500/40"
      [class.border-red-500]="invalid('password')"
      [class.ring-3]="invalid('password')"
      [class.ring-red-500/20]="invalid('password')"
      [attr.aria-invalid]="invalid('password') ? 'true' : null"
    />
    @if (passwordError(); as message) {
      <div role="alert" class="text-sm font-normal text-red-500 dark:text-red-400">{{ message }}</div>
    }
  </div>

  <div role="group" class="group/field flex w-full flex-col gap-2 *:w-full">
    <label class="mb-1.5 block flex w-fit gap-2 text-sm leading-snug font-medium text-gray-700 select-none dark:text-gray-400" for="admin-new-password-confirm">
      Confirmar contraseña <span class="text-red-500" aria-hidden="true">*</span>
    </label>
    <input
      id="admin-new-password-confirm"
      formControlName="confirm"
      type="password"
      placeholder="Repite tu contraseña"
      autocomplete="new-password"
      class="h-11 w-full min-w-0 rounded-[10px] border border-gray-300 bg-white px-4 py-2.5 text-sm font-normal text-gray-800 shadow-theme-xs transition-colors outline-hidden placeholder:text-gray-400 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-gray-500 dark:focus:border-brand-500/40"
      [class.border-red-500]="invalid('confirm')"
      [class.ring-3]="invalid('confirm')"
      [class.ring-red-500/20]="invalid('confirm')"
      [attr.aria-invalid]="invalid('confirm') ? 'true' : null"
    />
    @if (confirmError(); as message) {
      <div role="alert" class="text-sm font-normal text-red-500 dark:text-red-400">{{ message }}</div>
    }
  </div>

  @if (failed(); as message) {
    <div role="alert" class="rounded-[10px] border border-red-500/30 bg-red-50 px-4 py-3 text-sm text-red-600 dark:bg-red-500/10 dark:text-red-400">
      {{ message }}
    </div>
  }

  <div>
    <button
      type="submit"
      [disabled]="submitting()"
      class="inline-flex h-11 w-full items-center justify-center gap-2 rounded-[10px] bg-brand-500 px-5 py-3 text-sm font-medium text-white shadow-theme-xs transition-all hover:bg-brand-600 disabled:cursor-not-allowed disabled:bg-brand-200 dark:disabled:bg-brand-800"
    >
      {{ submitting() ? 'Guardando…' : submitLabel }}
    </button>
  </div>
</form>
