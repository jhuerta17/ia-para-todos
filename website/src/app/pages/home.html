<main id="main-content" tabindex="-1">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-panel">
      <picture>
        <source media="(max-width: 809px)" srcset="/images/everyday-phone-1600.webp" />
        <img class="hero-photo" src="/images/community-group-1600.webp"
        srcset="/images/community-group-480.webp 480w, /images/community-group-960.webp 960w, /images/community-group-1600.webp 1600w"
        sizes="100vw" width="1600" height="1066" fetchpriority="high"
        [alt]="c().photo" />
      </picture>
      <div class="hero-content">
        <div class="hero-copy">
          <h1 id="hero-title">{{ c().title }}</h1>
          <p>{{ c().lead }}</p>
          <div class="hero-actions">
            <app-action-link to="/talleres" [label]="c().explore" tone="warm" />
            <app-action-link to="/nosotros" [label]="c().initiative" />
          </div>
        </div>
        <app-intro-cards />
      </div>
    </div>
  </section>
  <app-topic-strip />
  <app-mission-reveal />
  <app-workshop-section />
  <app-program-facts />
  <app-activity-section />
  <app-learning-benefits />
  <app-community-introduction />
  <app-community-invitation />
  <app-learning-stories />
  <app-participation-section />
  <app-resource-section />
  <app-faq-section />
</main>
