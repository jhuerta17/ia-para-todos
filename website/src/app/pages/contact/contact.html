<main id="main-content" tabindex="-1"><section class="panel" aria-labelledby="contact-title"><header appRevealOnEnter><h1 id="contact-title">{{ c().title }}</h1><p>{{ c().lead }}</p></header><div class="channels" appRevealOnEnter>@for (channel of channels(); track channel.title) {<div class="channel"><app-icon [name]="channel.icon" /><div><h2>{{ channel.title }}</h2><p>{{ channel.description }}</p></div></div>}<ul class="social" [attr.aria-label]="c().social">@for (item of social; track item.name) {<li [attr.aria-label]="item.name + ': ' + c().channelPending"><app-icon [name]="item.icon" /><span>{{ c().pending }}</span></li>}</ul></div></section><app-faq-section /></main>
