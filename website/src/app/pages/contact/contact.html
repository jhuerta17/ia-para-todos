<main id="main-content" tabindex="-1"><section class="panel" aria-labelledby="contact-title"><header appRevealOnEnter><h1 id="contact-title">Conversemos</h1><p>Queremos escuchar preguntas e ideas para aprender en comunidad. Consulta el estado de cada canal.</p></header><div class="channels" appRevealOnEnter>@for (channel of channels; track channel.title) {<div class="channel"><app-icon [name]="channel.icon" /><div><h2>{{ channel.title }}</h2><p>{{ channel.description }}</p></div></div>}<ul class="social" aria-label="Redes sociales">@for (item of social; track item.name) {<li [attr.aria-label]="item.name + ': canal por definir'"><app-icon [name]="item.icon" /><span>Por definir</span></li>}</ul></div></section><app-faq-section /></main>
