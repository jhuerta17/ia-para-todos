<section aria-labelledby="resources-title"><header appRevealOnEnter><div><h2 id="resources-title">Aprende a tu ritmo</h2><p>Guías sencillas para descubrir la IA y seguir aprendiendo a tu ritmo.</p></div><app-action-link to="/recursos" label="Ver todos" /></header>
<div class="cards">@for (resource of resources; track resource.slug; let index = $index) {<article [class.featured]="index === 0" appRevealOnEnter><a [routerLink]="'/recursos/' + resource.slug" [attr.aria-label]="'Leer recurso: ' + resource.title"><div class="photo"><img [src]="'/images/' + resource.image + '-960.webp'" [srcset]="'/images/' + resource.image + '-480.webp 480w, /images/' + resource.image + '-960.webp 960w'" sizes="(max-width: 809px) calc(100vw - 60px), 380px" width="960" height="640" alt="" loading="lazy" /></div><div class="copy"><div class="meta"><span>Recurso</span><span class="tag">{{ resource.category }}</span></div><h3>{{ resource.title }}</h3><p>{{ resource.summary }}</p><span class="read">Leer recurso <app-icon name="arrow-up-right" /></span></div></a></article>}</div><p class="caption">Fotografías ilustrativas de archivo.</p></section>
