<section aria-labelledby="resources-title"><header appRevealOnEnter><div><h2 id="resources-title">{{ c().heading }}</h2><p>{{ c().lead }}</p></div><app-action-link to="/recursos" [label]="c().viewAll" /></header>
<div class="cards">@for (resource of resources(); track resource.slug; let index = $index) {<article [class.featured]="index === 0" appRevealOnEnter><a [routerLink]="language.detail('recursos', resource.slug)" [attr.aria-label]="c().read + ': ' + resource.title"><div class="photo"><img [src]="'/images/' + resource.image + '-960.webp'" [srcset]="'/images/' + resource.image + '-480.webp 480w, /images/' + resource.image + '-960.webp 960w'" sizes="(max-width: 809px) calc(100vw - 60px), 380px" width="960" height="640" alt="" loading="lazy" /></div><div class="copy"><div class="meta"><span>{{ c().kind }}</span><span class="tag">{{ resource.category }}</span></div><h3>{{ resource.title }}</h3><p>{{ resource.summary }}</p><span class="read">{{ c().read }} <app-icon name="arrow-up-right" /></span></div></a></article>}</div><p class="caption">{{ caption() }}</p></section>
