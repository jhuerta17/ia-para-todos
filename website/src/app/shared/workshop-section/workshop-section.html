<section aria-labelledby="workshops-title">
  <div class="panel">
    <div class="content">
      <div class="section-heading">
        <div><h2 id="workshops-title">{{ c().heading }}</h2><p>{{ c().lead }}</p></div>
        <app-action-link to="/talleres" [label]="c().viewAll" />
      </div>
      <div class="rows" appStackedRows>
        @for (row of rows(); track $index) {
          <div class="card-row">
            @for (workshop of row; track workshop.slug) { <app-workshop-card [workshop]="workshop" /> }
          </div>
        }
      </div>
    </div>
  </div>
</section>
