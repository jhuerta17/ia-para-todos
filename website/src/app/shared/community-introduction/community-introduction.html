<section aria-labelledby="community-introduction-title">
  <h2 id="community-introduction-title" class="visually-hidden">{{ c().heading }}</h2>
  <div class="introduction">
    <div class="statement" appRevealOnEnter>
      <app-icon class="quote-icon" name="quote" />
      <blockquote><p>{{ c().quote }}</p></blockquote>
      <div class="signature"><app-brand-mark /><span>{{ language.brand() }}</span></div>
      <app-action-link to="/nosotros" [label]="c().meet" />
    </div>
    <figure appRevealOnEnter>
      <div class="community-photo">
        <img src="/images/community-group-960.webp"
          srcset="/images/community-group-480.webp 480w, /images/community-group-960.webp 960w, /images/community-group-1600.webp 1600w"
          sizes="(max-width: 809px) calc(100vw - 40px), 495px" width="1600" height="1066"
          [alt]="c().photo" loading="lazy" />
      </div>
    </figure>
  </div>
  <div class="roles-introduction" appRevealOnEnter>
    <h3>{{ c().rolesHeading }}</h3>
    <p>{{ c().roles }}</p>
  </div>
  <app-collaboration-carousel />
</section>
