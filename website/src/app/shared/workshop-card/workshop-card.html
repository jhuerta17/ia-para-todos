<article [attr.aria-labelledby]="'workshop-' + workshop().slug">
  <a class="media" [routerLink]="'/talleres/' + workshop().slug" [attr.aria-label]="'Ver taller: ' + workshop().title">
    <img [src]="'/images/' + workshop().image + '-960.webp'"
      [srcset]="'/images/' + workshop().image + '-480.webp 480w, /images/' + workshop().image + '-960.webp 960w, /images/' + workshop().image + '-1600.webp 1600w'"
      sizes="(max-width: 809px) calc(100vw - 108px), (max-width: 1199px) 45vw, 482px"
      [alt]="workshop().alt" width="960" height="640" loading="lazy" />
  </a>
  <div class="metadata"><span>Taller</span><span class="category">{{ workshop().category }}</span></div>
  <h3 [id]="'workshop-' + workshop().slug">{{ workshop().shortTitle }}</h3>
  <p class="summary">{{ workshop().summary }}</p>
  <dl>
    <div><dt>Duración</dt><dd>90–120 min</dd></div>
    <div><dt>Dispositivo</dt><dd>Teléfono</dd></div>
  </dl>
  <app-action-link [to]="'/talleres/' + workshop().slug" label="Ver taller" [accessibleLabel]="'Ver taller: ' + workshop().title" />
</article>
