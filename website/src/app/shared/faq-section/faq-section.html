<section aria-labelledby="faq-title"><header appRevealOnEnter><h2 id="faq-title">Preguntas frecuentes</h2><p>Antes de empezar, resolvamos algunas dudas.</p></header><div class="questions" appRevealOnEnter>@for (item of questions; track item.question; let index = $index) {<div class="item" [class.open]="open() === index"><h3><button type="button" [id]="'faq-question-' + index" [attr.aria-expanded]="open() === index" [attr.aria-controls]="'faq-answer-' + index" (click)="toggle(index)"><span>{{ item.question }}</span><app-icon name="plus" /></button></h3><div class="answer" [id]="'faq-answer-' + index" [attr.aria-labelledby]="'faq-question-' + index" [attr.aria-hidden]="open() !== index" [attr.inert]="open() !== index ? '' : null"><div><p>{{ item.answer }}</p></div></div></div>}</div></section>
