<div class="carousel" role="region" [attr.aria-label]="c().region" [attr.aria-roledescription]="c().carousel">
  <ul #track class="track" tabindex="0" [attr.aria-label]="c().track" (scroll)="updateEdges()" (keydown)="onKeydown($event)">
    @for (role of roles(); track role.title) {
      <li>
        <div class="photo"><img [src]="'/images/' + role.image + '-480.webp'" alt="" width="480" height="320" loading="lazy" /></div>
        <div class="copy"><p class="eyebrow">{{ c().eyebrow }}</p><h4>{{ role.title }}</h4><p>{{ role.description }}</p></div>
      </li>
    }
  </ul>
  <div class="toolbar">
    <div class="controls">
      <button class="public-control" type="button" [attr.aria-label]="c().prev" [disabled]="atStart()" (click)="move(-1)"><app-icon name="arrow-left" /></button>
      <button class="public-control" type="button" [attr.aria-label]="c().next" [disabled]="atEnd()" (click)="move(1)"><app-icon name="arrow-right" /></button>
    </div>
  </div>
</div>
