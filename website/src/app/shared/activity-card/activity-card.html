<article [attr.aria-labelledby]="'activity-' + activity().slug">
  <a class="media" [routerLink]="language.detail('actividades', activity().slug)" [attr.aria-label]="c().view + ': ' + activity().title">
    <img [src]="'/images/' + activity().image + '-960.webp'"
      [srcset]="'/images/' + activity().image + '-480.webp 480w, /images/' + activity().image + '-960.webp 960w, /images/' + activity().image + '-1600.webp 1600w'"
      sizes="(max-width: 809px) calc(100vw - 68px), (max-width: 1199px) 45vw, 482px"
      [alt]="activity().alt" width="960" height="640" loading="lazy" />
  </a>
  <div class="metadata"><span>{{ c().kind }}</span><span class="category">{{ activity().category }}</span></div>
  <h3 [id]="'activity-' + activity().slug">{{ activity().shortTitle }}</h3>
  <p class="summary">{{ activity().summary }}</p>
  <dl><div><dt>{{ c().focus }}</dt><dd>{{ activity().focus }}</dd></div><div><dt>{{ c().practice }}</dt><dd>{{ c().guided }}</dd></div></dl>
  <app-action-link [to]="'/actividades/' + activity().slug" [label]="c().view" [accessibleLabel]="c().view + ': ' + activity().title" />
</article>
