# Docs check — validates Markdown links, required files, and script syntax.
# Minimal permissions, first-party actions only.
name: docs-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          for s in scripts/*.sh; do
            bash -n "$s"
          done

      - name: Validate docs
        run: ./scripts/validate-docs.sh
